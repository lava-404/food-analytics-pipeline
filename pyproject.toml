[project]
name = "food-delivery-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lavanya", email = "lavanyaropt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faker>=40.43.0",
    "kafka-python-ng>=2.2.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "streamlit>=1.66.0",
]

[project.scripts]
food-delivery-analytics = "food_delivery_analytics:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
